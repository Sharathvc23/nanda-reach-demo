<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corroboration Demo</title>
<style>
  :root { --bg:#f5f7fa; --panel:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --accent-ink:#fff; --merchant:#0d9488; --warn:#c2410c; --ok:#15803d; --soft:#f9fafb; --chip:#eef2ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 16px; }
  header { padding:18px 0 6px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  h1 { margin:0; font-size:22px; font-weight:650; }
  .token { margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12.5px; } .token input { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; width:150px; }
  .status { color:var(--muted); font-size:13px; min-height:22px; padding:2px 0 6px; } .status.err { color:var(--warn); }
  .verdict { display:grid; grid-template-columns:auto 1fr; gap:14px 18px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:12px; }
  .badge { font-size:26px; font-weight:750; letter-spacing:.02em; padding:10px 18px; border-radius:12px; color:#fff; background:var(--muted); min-width:220px; text-align:center; }
  .badge.AGREE { background:var(--ok); } .badge.DIVERGENT { background:var(--warn); } .badge.INSUFFICIENT { background:#9ca3af; }
  .facts { font-size:13.5px; color:var(--muted); display:grid; gap:3px; } .facts b { color:var(--ink); font-weight:600; } code { background:var(--soft); border:1px solid var(--line); padding:1px 5px; border-radius:4px; font-size:12px; word-break:break-all; }
  .pill { display:inline-block; border-radius:999px; padding:1px 8px; font-size:12px; font-weight:600; background:var(--chip); color:var(--accent); } .pill.bad { background:#fff1ec; color:var(--warn); } .pill.good { background:#f0fdf4; color:var(--ok); }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; align-items:center; }
  .btns .grp { display:flex; gap:6px; align-items:center; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:var(--panel); } .btns .grp span { color:var(--muted); font-size:12px; margin-right:2px; }
  button { font:inherit; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13.5px; }
  button.merchant { background:var(--merchant); border-color:var(--merchant); } button.attack { background:var(--warn); border-color:var(--warn); } button.secondary { background:var(--panel); color:var(--ink); border-color:var(--line); font-weight:500; } button:disabled { opacity:.5; cursor:progress; }
  main { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:12px; padding-bottom:28px; } @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  h2 { margin:0 0 8px; font-size:15px; font-weight:650; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; } th { text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 8px 6px 0; border-bottom:1px solid var(--line); } td { padding:8px 8px 8px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  td.src { font-weight:650; white-space:nowrap; } .st { font-size:12px; font-weight:600; } .st.ok { color:var(--ok); } .st.not_found, .st.invalid { color:var(--warn); } .st.unreachable { color:var(--muted); }
  .claim { display:inline-block; margin:1px 6px 1px 0; font-size:12.5px; } .claim b { color:var(--muted); font-weight:600; } .claim.diff { background:#fff1ec; border-radius:4px; padding:0 4px; }
  .finding { padding:8px 10px; border-left:3px solid var(--warn); background:#fff7ed; border-radius:6px; margin:6px 0; font-size:13.5px; } .finding b { font-weight:700; }
  .ms { color:var(--muted); font-size:11.5px; }
  .trace { font:12px/1.45 Consolas, "Courier New", monospace; color:var(--muted); white-space:pre-wrap; margin:6px 0 0; } .trace .hit { color:var(--ok); } .trace .err { color:var(--warn); }
  .empty { color:var(--muted); font-style:italic; font-size:13px; }
  footer { color:var(--muted); font-size:12.5px; padding-bottom:28px; } a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
<header><h1>Corroboration</h1><a href="/" style="font-size:13px">main demo</a><label class="token">admin token <input id="token" type="password" autocomplete="off" /></label></header>
<div id="status" class="status"></div>

<div class="verdict">
  <div class="badge" id="badge">…</div>
  <div class="facts">
    <div>subject <code id="subject">…</code></div>
    <div>Index points at <code id="indexurl">…</code> <span id="indexflag"></span></div>
    <div>card host <span id="tamperflag"></span> · last check <b id="checked">…</b></div>
  </div>
</div>

<div class="btns">
  <button id="check" class="secondary">Check now</button>
  <div class="grp"><span>card host</span><button id="tamper" class="attack">Tamper</button><button id="untamper" class="secondary">Restore</button></div>
  <div class="grp"><span>Index entry</span><button id="hijack" class="attack">Hijack</button><button id="restore" class="secondary">Restore</button></div>
  <button id="promo" class="merchant">Travel26: send promotion</button>
</div>

<main>
  <section>
    <h2>Sources</h2>
    <table><thead><tr><th>Source</th><th>Status</th><th>Claims</th></tr></thead><tbody id="sources"></tbody></table>
    <div id="findings" style="margin-top:10px"></div>
  </section>
  <section>
    <h2>Last send</h2>
    <div id="log"></div>
  </section>
</main>
<footer id="foot"></footer>
</div>
<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const tokenInput=$("token"); try{tokenInput.value=localStorage.getItem("adminToken")||"";}catch{}
  // A shared link can carry the token: https://host/#token=…  It is stored on first open and removed from the address bar.
  try{const hm=location.hash.match(/[#&]token=([^&]+)/); if(hm){tokenInput.value=decodeURIComponent(hm[1]).trim(); localStorage.setItem("adminToken",tokenInput.value); history.replaceState(null,"",location.pathname+location.search);}}catch{}
  const tokenState=document.createElement("span"); tokenState.style.cssText="font-size:12px;margin-left:6px"; tokenInput.insertAdjacentElement("afterend",tokenState);
  let tokenTimer=null; async function verifyToken(){const v=tokenInput.value.trim(); if(v!==tokenInput.value) tokenInput.value=v; try{localStorage.setItem("adminToken",v);}catch{} if(!v){tokenState.textContent=""; return;} tokenState.textContent="…"; try{const r=await fetch("/admin/check",{headers:{authorization:"Bearer "+v}}); tokenState.textContent=r.ok?"✓ ok":"✗ rejected"; tokenState.style.color=r.ok?"var(--ok)":"var(--warn)";}catch{tokenState.textContent="?";}}
  tokenInput.addEventListener("input",()=>{clearTimeout(tokenTimer); tokenTimer=setTimeout(verifyToken,400);}); tokenInput.addEventListener("change",verifyToken); if(tokenInput.value) verifyToken();
  const headers=(hasBody)=>{const h={}; if(hasBody) h["content-type"]="application/json"; if(tokenInput.value.trim()) h["authorization"]="Bearer "+tokenInput.value.trim(); return h;};
  const setStatus=(t,err)=>{const el=$("status"); el.textContent=t; el.className="status"+(err?" err":"");};
  async function api(method,url,body){const res=await fetch(url,{method,headers:headers(body!==undefined),body:body===undefined?undefined:JSON.stringify(body)}); const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error||(method+" "+url+" -> "+res.status)); return data;}
  const trace=(t)=>'<div class="trace">'+(t||[]).map((x)=>'<div class="'+(/^Corroboration: AGREE|^InkBox: sent|^Route:/.test(x)?"hit":/^Error|^  finding|^Corroboration: DIVERGENT/.test(x)?"err":"")+'">'+esc(x)+"</div>").join("")+"</div>";
  const fieldsInDispute=(r)=>new Set((r.findings||[]).map((f)=>f.field).filter(Boolean));
  function render(r, idx, state){
    const v=r.verdict||"INSUFFICIENT"; $("badge").textContent=v; $("badge").className="badge "+v;
    $("subject").textContent=r.subject||"";
    $("checked").textContent=r.checked_at?new Date(r.checked_at).toLocaleTimeString():"";
    if(idx){ $("indexurl").textContent=idx.registry_url||"?"; $("indexflag").innerHTML=idx.hijacked?'<span class="pill bad">hijacked</span>':'<span class="pill good">own card</span>'; }
    $("tamperflag").innerHTML=state&&state.tamper?'<span class="pill bad">tampered → '+esc(state.tamper.inbox_address)+'</span>':'<span class="pill good">serving the signed card</span>';
    const dispute=fieldsInDispute(r);
    $("sources").innerHTML=(r.sources||[]).map((s)=>'<tr><td class="src">'+esc(s.source)+'</td><td><span class="st '+esc(s.status)+'">'+esc(s.status)+'</span>'+(s.ms!==undefined?' <span class="ms">'+s.ms+' ms</span>':'')+(s.detail?'<div class="ms">'+esc(s.detail)+'</div>':'')+'</td><td>'+Object.entries(s.claims||{}).filter(([,v])=>v!==null).map(([k,v])=>'<span class="claim'+(dispute.has(k)?" diff":"")+'"><b>'+esc(k)+'</b> '+esc(String(v)).slice(0,70)+'</span>').join("")+'</td></tr>').join("")||'<tr><td colspan="3" class="empty">No locator held by Travel26 yet. Shop first on the main page.</td></tr>';
    $("findings").innerHTML=(r.findings||[]).map((f)=>'<div class="finding"><b>'+esc(f.kind)+(f.field?' · '+esc(f.field):'')+'</b> — '+esc(f.detail)+'</div>').join("");
    const last=r.last_send; $("log").innerHTML=last?'<div><strong>'+esc(last.subject)+'</strong> <span class="ms">'+new Date(last.at).toLocaleTimeString()+'</span></div><div style="margin:4px 0">'+(last.delivered_to?'<span class="pill good">delivered</span> '+esc(last.delivered_to.agent)+' '+esc(last.delivered_to.address):'<span class="pill bad">held</span> '+esc(last.error||""))+'</div>'+trace(last.trace):'<div class="empty">None.</div>';
  }
  async function refresh(){
    const [r,idx,state]=await Promise.all([fetch("/merchant/corroborate",{headers:headers(false)}).then((x)=>x.ok?x.json():x.json().then((j)=>({error:x.status===401?"admin token required to view this page":(j.error||("HTTP "+x.status))}))).catch((e)=>({error:e.message})),fetch("/index/status").then((x)=>x.json()).catch(()=>null),fetch("/state").then((x)=>x.json()).catch(()=>null)]);
    if(r.error&&!r.sources){ $("badge").textContent="—"; $("badge").className="badge"; $("sources").innerHTML='<tr><td colspan="3" class="empty">'+esc(r.error)+'</td></tr>'; if(idx){$("indexurl").textContent=idx.registry_url||"?";} return; }
    render(r,idx,state);
  }
  async function run(label,fn){const bs=document.querySelectorAll("button"); bs.forEach((b)=>b.disabled=true); setStatus(label+"…"); try{const out=await fn(); setStatus(label+" done."+(out?" "+out:"")); }catch(e){setStatus(label+" failed: "+e.message,true);}finally{bs.forEach((b)=>b.disabled=false);} await refresh();}
  $("check").onclick=()=>run("Check",async()=>"");
  $("tamper").onclick=()=>run("Tamper card host",async()=>{const r=await api("POST","/card/tamper",{}); return "inbox swapped to "+r.inbox_address+" after signing.";});
  $("untamper").onclick=()=>run("Restore card host",async()=>{await api("POST","/card/untamper"); return "";});
  $("hijack").onclick=()=>run("Hijack Index entry",async()=>{const r=await api("POST","/index/point",{}); return "entry now points at "+r.registry_url;});
  $("restore").onclick=()=>run("Restore Index entry",async()=>{const r=await api("POST","/index/restore"); return "entry points at "+r.registry_url;});
  $("promo").onclick=()=>run("Travel26 send",async()=>{const r=await api("POST","/merchant/promo",{subject:"Travel26: Lisbon in December from $489"}); const d=(r.results||[]).find((x)=>x.delivered_to||x.error)||r.results?.[0]; if(!d) return "nobody to send to"; return d.delivered_to?"delivered to "+d.delivered_to.agent+" ("+d.delivered_to.address+")":d.error;});
  (async()=>{const cfg=await api("GET","/config"); $("foot").textContent="index "+cfg.index_base_url+" · merchant "+cfg.travel26_url+" · locator "+cfg.locator; await refresh(); setInterval(refresh,5000);})().catch((e)=>setStatus("Could not load: "+e.message,true));
})();
</script>
</body>
</html>
